<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Year-based MCQ</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--light);
            padding-bottom: 15px;
        }

        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        select {
            border: 1px solid #ccc;
        }

        .btn-next {
            background-color: var(--primary);
            color: white;
            border: none;
            display: none; /* Hidden until answer is checked */
        }

        .question-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .question-img, .answer-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: white;
            border: 2px solid var(--dark);
            color: var(--dark);
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--light);
        }

        /* State Styles */
        .option-btn.correct {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .option-btn.wrong {
            background-color: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        .feedback-area {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none; /* Hidden initially */
        }

        .feedback-area.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .feedback-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Utility for empty state */
        .empty-state {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <label for="yearSelect"><strong>Select Year: </strong></label>
            <select id="yearSelect" onchange="resetQuiz()">
                <!-- Options populated by JS -->
            </select>
        </div>
        <div id="progress">Question 0 / 0</div>
    </header>

    <!-- Start Screen -->
    <div id="startScreen" class="empty-state">
        <h2>Ready to practice?</h2>
        <p>Select a year above and click Start.</p>
        <button onclick="startQuiz()" style="background: var(--primary); color: white; border: none;">Start Quiz</button>
    </div>

    <!-- Quiz Area -->
    <div id="quizInterface" style="display: none;">
        <div class="question-area">
            <!-- Question Image Source -->
            <img id="questionImage" src="" alt="Question" class="question-img">
        </div>

        <div class="options-grid">
            <button class="option-btn" onclick="checkAnswer('A')">A</button>
            <button class="option-btn" onclick="checkAnswer('B')">B</button>
            <button class="option-btn" onclick="checkAnswer('C')">C</button>
            <button class="option-btn" onclick="checkAnswer('D')">D</button>
        </div>

        <div id="feedback" class="feedback-area">
            <div id="feedbackText" class="feedback-text"></div>
            <p><strong>Explanation / Correct Answer:</strong></p>
            <!-- Answer Image Source -->
            <img id="answerImage" src="" alt="Answer Explanation" class="answer-img">
            <br>
            <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next Question ➜</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. CONFIGURATION DATA
    // ==========================================
    
    // Define the correct answers for each year here.
    // Format: "QuestionNumber": "CorrectOption"
    const answerKeys = {
        "2023": {
            1: "A", 2: "B", 3: "C", 4: "D", 5: "A", 
            // ... fill up to 36 ...
            36: "B" 
        },
        "2022": {
            1: "C", 2: "C", 3: "A", 4: "B", 5: "D",
            // ... fill up to 36 ...
            36: "A"
        },
        "2021": {
            1: "B", 2: "A", 3: "D", 4: "C", 5: "A",
            // ... fill up to 36 ...
            36: "C"
        }
    };

    // To simulate 36 questions for the demo without typing 100 lines, 
    // I will auto-fill the data above if missing. 
    // In production, YOU should fill the objects above exactly.
    function fillMockData() {
        const years = ["2023", "2022", "2021"];
        years.forEach(y => {
            if(!answerKeys[y]) answerKeys[y] = {};
            for(let i=1; i<=36; i++) {
                if(!answerKeys[y][i]) {
                    // Random answer for demo purposes
                    const opts = ['A','B','C','D'];
                    answerKeys[y][i] = opts[Math.floor(Math.random() * 4)];
                }
            }
        });
    }
    fillMockData(); 

    // ==========================================
    // 2. STATE VARIABLES
    // ==========================================
    let currentYear = "";
    let questionOrder = []; // Array of question numbers (shuffled)
    let currentIndex = 0;
    let isAnswered = false;

    // ==========================================
    // 3. INITIALIZATION
    // ==========================================
    const yearSelect = document.getElementById('yearSelect');
    
    // Populate Dropdown
    Object.keys(answerKeys).forEach(year => {
        let option = document.createElement("option");
        option.value = year;
        option.text = year;
        yearSelect.appendChild(option);
    });

    // ==========================================
    // 4. LOGIC FUNCTIONS
    // ==========================================

    function resetQuiz() {
        document.getElementById('startScreen').style.display = 'block';
        document.getElementById('quizInterface').style.display = 'none';
        document.getElementById('progress').innerText = "Question 0 / 0";
    }

    function startQuiz() {
        currentYear = yearSelect.value;
        
        // Create array [1, 2, ..., 36]
        questionOrder = Array.from({length: 36}, (_, i) => i + 1);
        
        // Shuffle the array (Randomize)
        shuffleArray(questionOrder);
        
        currentIndex = 0;
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizInterface').style.display = 'block';
        
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= questionOrder.length) {
            alert("End of questions for this year!");
            resetQuiz();
            return;
        }

        isAnswered = false;
        const qNum = questionOrder[currentIndex];

        // Update Progress
        document.getElementById('progress').innerText = `Question ${currentIndex + 1} / ${questionOrder.length} (ID: ${qNum})`;

        // --- IMAGE PATH LOGIC ---
        // IMPORTANT: Update this path structure to match your folders
        // Example: images/2023/q_1.jpg
        
        // For DEMO, I am using a placeholder service. 
        // REPLACE the lines below with:
        // const qSrc = `images/${currentYear}/q_${qNum}.jpg`;
        // const aSrc = `images/${currentYear}/a_${qNum}.jpg`;
        
        const qSrc = `https://placehold.co/600x300/3498db/white?text=${currentYear}+Question+${qNum}`;
        const aSrc = `https://placehold.co/600x300/2ecc71/white?text=${currentYear}+Answer+${qNum}`;

        document.getElementById('questionImage').src = qSrc;
        document.getElementById('answerImage').src = aSrc;

        // Reset UI
        document.getElementById('feedback').classList.remove('show');
        document.getElementById('nextBtn').style.display = 'none';
        
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach(btn => {
            btn.disabled = false;
            btn.classList.remove('correct', 'wrong');
        });
    }

    function checkAnswer(selectedOption) {
        if (isAnswered) return; // Prevent multiple clicks
        isAnswered = true;

        const qNum = questionOrder[currentIndex];
        const correctOption = answerKeys[currentYear][qNum];
        
        const feedbackDiv = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedbackText');
        const btns = document.querySelectorAll('.option-btn');

        // Visual Feedback on Buttons
        btns.forEach(btn => {
            btn.disabled = true; // Lock buttons
            if (btn.innerText === correctOption) {
                btn.classList.add('correct');
            }
            if (btn.innerText === selectedOption && selectedOption !== correctOption) {
                btn.classList.add('wrong');
            }
        });

        // Text Feedback
        if (selectedOption === correctOption) {
            feedbackText.innerHTML = `<span style="color:var(--success)">✔ Correct!</span>`;
            feedbackDiv.style.border = "2px solid var(--success)";
        } else {
            feedbackText.innerHTML = `<span style="color:var(--danger)">✘ Incorrect. The answer was ${correctOption}.</span>`;
            feedbackDiv.style.border = "2px solid var(--danger)";
        }

        // Show Answer Image and Next Button
        feedbackDiv.classList.add('show');
        document.getElementById('nextBtn').style.display = 'inline-block';
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    // Fisher-Yates Shuffle Algorithm
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
</script>

</body>
</html>
