<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HKDSE Physics: Scientific Notation (Basic Practice)</title>
    <style>
        :root {
            --primary: #0076d6;
            --secondary: #475569;
            --success: #16a34a;
            --danger: #dc2626;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            color: #1e293b;
            line-height: 1.5;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0 0 5px 0;
            font-size: 1.6rem;
        }

        .instructions {
            background-color: #e0f2fe;
            border-left: 4px solid var(--primary);
            padding: 12px 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 0.95rem;
        }

        .question-card {
            background-color: var(--card-bg);
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 15px;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .q-number {
            font-weight: bold;
            color: var(--primary);
        }

        .tag {
            background-color: #f1f5f9;
            color: var(--secondary);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        input[type="number"] {
            padding: 6px 10px;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            font-size: 1rem;
            text-align: center;
        }

        input.mantissa { width: 90px; }
        input.exponent { width: 60px; }

        .unit {
            font-weight: 600;
            color: var(--secondary);
            margin-left: 5px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
        }

        .btn-submit:hover { background-color: #005bb5; }

        .btn-reset {
            background-color: #64748b;
            color: white;
        }

        .btn-reset:hover { background-color: #475569; }

        .feedback {
            margin-top: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .correct { color: var(--success); }
        .incorrect { color: var(--danger); }

        .solution {
            display: none;
            font-size: 0.85rem;
            color: var(--secondary);
            margin-top: 4px;
        }

        #results {
            display: none;
            background-color: #dcfce7;
            color: #14532d;
            border: 1px solid #86efac;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.2rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>HKDSE Physics: Scientific Notation</h1>
        <p>Basic Practice • Express answers as <strong>a × 10<sup>b</sup></strong></p>
    </header>

    <div class="instructions">
        <strong>Rule:</strong> Express the number in scientific notation where <code>1 ≤ a < 10</code> and <code>b</code> is an integer. 
        <br><em>Example: <code>300,000</code> = <code>3.0</code> × 10<sup><code>5</code></sup></em>
    </div>

    <div id="quiz-container"></div>

    <div class="btn-container">
        <button class="btn-submit" onclick="checkAnswers()">Check Answers</button>
        <button class="btn-reset" onclick="loadQuiz()">Shuffle / New Questions</button>
    </div>

    <div id="results"></div>

    <script>
        // Question Pool (Simple HKDSE Physics Concepts)
        const questionPool = [
            {
                tag: "Mechanics",
                text: "The speed of light in a vacuum is 300,000,000 m/s.",
                unit: "m/s",
                m: 3, e: 8,
                sol: "300,000,000 = 3 × 10⁸"
            },
            {
                tag: "Waves & Optics",
                text: "Red light has a wavelength of 0.0000007 m.",
                unit: "m",
                m: 7, e: -7,
                sol: "0.0000007 = 7 × 10⁻⁷"
            },
            {
                tag: "Electricity",
                text: "A current in a sensitive sensor is 0.005 A.",
                unit: "A",
                m: 5, e: -3,
                sol: "0.005 = 5 × 10⁻³"
            },
            {
                tag: "Energy",
                text: "An electric kettle uses 2,200 W of power.",
                unit: "W",
                m: 2.2, e: 3,
                sol: "2,200 = 2.2 × 10³"
            },
            {
                tag: "Electricity",
                text: "High voltage power cables operate at 400,000 V.",
                unit: "V",
                m: 4, e: 5,
                sol: "400,000 = 4 × 10⁵"
            },
            {
                tag: "Atomic Physics",
                text: "The diameter of an atom is approximately 0.0000000001 m.",
                unit: "m",
                m: 1, e: -10,
                sol: "0.0000000001 = 1 × 10⁻¹⁰"
            },
            {
                tag: "Waves & Optics",
                text: "A radio station transmits signals at a frequency of 90,300,000 Hz.",
                unit: "Hz",
                m: 9.03, e: 7,
                sol: "90,300,000 = 9.03 × 10⁷"
            },
            {
                tag: "Mechanics",
                text: "A fully loaded freight train has a mass of 1,500,000 kg.",
                unit: "kg",
                m: 1.5, e: 6,
                sol: "1,500,000 = 1.5 × 10⁶"
            },
            {
                tag: "Thermal Physics",
                text: "Heating a block of metal requires 45,000 J of energy.",
                unit: "J",
                m: 4.5, e: 4,
                sol: "45,000 = 4.5 × 10⁴"
            },
            {
                tag: "Atomic Physics",
                text: "A camera shutter stays open for 0.00002 seconds.",
                unit: "s",
                m: 2, e: -5,
                sol: "0.00002 = 2 × 10⁻⁵"
            },
            {
                tag: "Waves & Optics",
                text: "X-rays have a wavelength of 0.0000000002 m.",
                unit: "m",
                m: 2, e: -10,
                sol: "0.0000000002 = 2 × 10⁻¹⁰"
            },
            {
                tag: "Energy",
                text: "A solar panel produces 120,000 J of energy in 10 minutes.",
                unit: "J",
                m: 1.2, e: 5,
                sol: "120,000 = 1.2 × 10⁵"
            }
        ];

        let currentQuestions = [];

        // Fisher-Yates Shuffle Algorithm
        function shuffle(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadQuiz() {
            // Hide results
            document.getElementById('results').style.display = 'none';

            // Shuffle pool and select first 10
            currentQuestions = shuffle(questionPool).slice(0, 10);

            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            currentQuestions.forEach((q, index) => {
                const qNum = index + 1;
                const card = document.createElement('div');
                card.className = 'question-card';
                card.innerHTML = `
                    <div class="q-header">
                        <span class="q-number">Question ${qNum}</span>
                        <span class="tag">${q.tag}</span>
                    </div>
                    <div>${q.text}</div>
                    <div class="input-box">
                        <input type="number" step="any" class="mantissa" id="m-${index}" placeholder="a">
                        <span>× 10</span>
                        <sup><input type="number" class="exponent" id="e-${index}" placeholder="b"></sup>
                        <span class="unit">${q.unit}</span>
                    </div>
                    <div class="feedback" id="fb-${index}"></div>
                    <div class="solution" id="sol-${index}">Answer: ${q.sol} ${q.unit}</div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswers() {
            let score = 0;

            currentQuestions.forEach((q, index) => {
                const userM = parseFloat(document.getElementById(`m-${index}`).value);
                const userE = parseInt(document.getElementById(`e-${index}`).value);
                const fbEl = document.getElementById(`fb-${index}`);
                const solEl = document.getElementById(`sol-${index}`);

                // Check tolerance for decimal places
                const isMantissaCorrect = !isNaN(userM) && Math.abs(userM - q.m) < 0.01;
                const isExponentCorrect = userE === q.e;

                if (isMantissaCorrect && isExponentCorrect) {
                    fbEl.textContent = "✓ Correct!";
                    fbEl.className = "feedback correct";
                    solEl.style.display = 'none';
                    score++;
                } else {
                    fbEl.textContent = "✗ Incorrect";
                    fbEl.className = "feedback incorrect";
                    solEl.style.display = 'block';
                }
            });

            const resultsEl = document.getElementById('results');
            resultsEl.style.display = 'block';
            resultsEl.innerHTML = `<strong>Your Score: ${score} / 10</strong><br>` + 
                (score === 10 ? "🎉 Great job! Perfect score!" : "Review the incorrect answers above and try again.");
            
            resultsEl.scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize quiz on page load
        window.onload = loadQuiz;
    </script>
</body>
</html>
