<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Mode (Fixed Timer)</title>
    <style>
        :root {
            --primary: #3498db;
            --selected: #2980b9;
            --success: #2ecc71;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --warning: #f39c12;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: white;
            max-width: 800px;
            width: 100%;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* --- Header Styles --- */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--light);
            padding-bottom: 15px;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .timer-display {
            font-family: monospace;
            font-size: 1.1rem;
            background: var(--dark);
            color: var(--light);
            padding: 5px 10px;
            border-radius: 5px;
            min-width: 100px;
            text-align: center;
        }

        .music-btn {
            background-color: var(--warning);
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* --- Standard UI --- */
        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        select { border: 1px solid #ccc; }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .btn-action:hover { background-color: #2573a7; }

        .question-area {
            text-align: center;
            margin-bottom: 20px;
        }

        .question-img, .answer-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: white;
            border: 2px solid var(--dark);
            color: var(--dark);
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .option-btn:hover { background-color: var(--light); }

        .option-btn.selected {
            background-color: var(--dark);
            color: white;
            border-color: var(--dark);
            transform: scale(1.02);
        }

        /* --- Result Section Styles --- */
        .summary-box {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }

        .score-large {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        /* Brief Review Grid */
        .brief-panel {
            background: #fff;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .brief-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .brief-item {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 40px;
            border-radius: 5px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .brief-item:hover { transform: scale(1.1); }
        .brief-item.correct { background-color: var(--success); }
        .brief-item.wrong { background-color: var(--danger); }

        /* Detailed Review */
        .review-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            background: white;
            scroll-margin-top: 20px;
        }

        .review-card.correct { border-left: 5px solid var(--success); }
        .review-card.wrong { border-left: 5px solid var(--danger); }

        .review-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .status-badge {
            padding: 3px 8px;
            border-radius: 4px;
            color: white;
            font-size: 0.9rem;
        }
        .bg-success { background-color: var(--success); }
        .bg-danger { background-color: var(--danger); }

        .explanation-box {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #ccc;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #7f8c8d;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112762.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <header>
        <div>
            <label for="yearSelect"><strong>Select Year: </strong></label>
            <select id="yearSelect" onchange="resetApp()">
                <!-- Options populated by JS -->
            </select>
        </div>
        
        <div class="header-controls">
            <div id="timerBox" class="timer-display">Time: 00:00</div>
            <button class="music-btn" onclick="toggleMusic()">🎵 Music</button>
        </div>
    </header>

    <div style="text-align: right; margin-bottom: 10px; font-weight: bold; color: #7f8c8d;" id="progress">
        Ready
    </div>

    <!-- 1. Start Screen -->
    <div id="startScreen" class="empty-state">
        <h2>Exam Mode</h2>
        <p>Complete all questions for the selected year.</p>
        
        <!-- 【新增】姓名輸入框 -->
        <div style="margin-bottom: 20px;">
            <input type="text" id="userNameInput" placeholder="Enter your name" style="padding: 12px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; width: 80%; max-width: 250px; text-align: center;">
        </div>

        <button class="btn-action" style="max-width: 200px;" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- 2. Quiz Interface (Active) -->
    <div id="quizInterface" style="display: none;">
        <div class="question-area">
            <img id="questionImage" src="" alt="Question" class="question-img">
        </div>

        <div class="options-grid">
            <button class="option-btn" id="btnA" onclick="selectOption('A')">A</button>
            <button class="option-btn" id="btnB" onclick="selectOption('B')">B</button>
            <button class="option-btn" id="btnC" onclick="selectOption('C')">C</button>
            <button class="option-btn" id="btnD" onclick="selectOption('D')">D</button>
        </div>

        <button id="nextBtn" class="btn-action" onclick="submitAnswer()">Next Question ➜</button>
    </div>

    <!-- 3. Result Interface (Summary) -->
    <div id="resultInterface" style="display: none;">
        <div class="summary-box">
            <h3>Quiz Completed!</h3>
            <div class="score-large" id="finalScore">0 / 0</div>
            <p id="finalTime" style="font-size: 1.2rem; font-weight: bold; margin-top: 10px;">Total Time: 00:00</p>
            <button class="btn-action" style="max-width: 200px; background-color: var(--dark);" onclick="resetApp()">Try Another Year</button>
        </div>

        <!-- Brief Review Section -->
        <h3>📊 Brief Review</h3>
        <p style="font-size:0.9rem; color:#666;">Click on a box to jump to details.</p>
        <div class="brief-panel">
            <div id="briefGrid" class="brief-grid">
                <!-- Grid items injected by JS -->
            </div>
        </div>

        <h3>📝 Detailed Review</h3>
        <div id="reviewContainer">
            <!-- Review cards will be injected here -->
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. DATA SETUP
    // ==========================================
    const answerKeys = {
        "2024": {1: "C", 2: "B", 3: "B", 4: "D", 5: "B", 6: "C", 7: "C", 8: "D", 9: "A", 10: "A", 11: "C", 12: "A", 13: "D", 14: "A", 15: "D", 16: "D", 17: "C", 18: "D", 19: "A", 20: "D", 21: "B", 22: "B", 23: "C", 24: "C", 25: "A", 26: "B", 27: "C", 28: "C", 29: "B", 30: "A", 31: "A", 32: "D", 33: "B"},
	"2023": {1: "B", 2: "D", 3: "C", 4: "A", 5: "B", 6: "D", 7: "B", 8: "C", 9: "C", 10: "A", 11: "B", 12: "C", 13: "D", 14: "C", 15: "D", 16: "B", 17: "A", 18: "B", 19: "A", 20: "A", 21: "A", 22: "D", 23: "D", 24: "C", 25: "A", 26: "D", 27: "B", 28: "C", 29: "A", 30: "B", 31: "C", 32: "D", 33: "D" }, 
        "2022": {  1: "A", 2: "B", 3: "D", 4: "C", 5: "A", 6: "B", 7: "B", 8: "B", 9: "D", 10: "D", 11: "A", 12: "D", 13: "C", 14: "A", 15: "B", 16: "C", 17: "D", 18: "B", 19: "C", 20: "A", 21: "C", 22: "D", 23: "C", 24: "D", 25: "D", 26: "B", 27: "A", 28: "C", 29: "B", 30: "A", 31: "C", 32: "A", 33: "C" },
        "2021": {1: "A", 2: "A", 3: "C", 4: "B", 5: "D", 6: "D", 7: "C", 8: "A", 9: "A", 10: "C", 11: "B", 12: "C", 13: "B", 14: "D", 15: "B", 16: "B", 17: "D", 18: "C", 19: "A", 20: "C", 21: "D", 22: "A", 23: "B", 24: "A", 25: "C", 26: "C", 27: "B", 28: "A", 29: "C", 30: "D", 31: "B", 32: "D", 33: "D"}
    };

    function fillMockData() {
        const years = ["2024","2023", "2022", "2021"];
        years.forEach(y => {
            if(!answerKeys[y]) answerKeys[y] = {};
            for(let i=1; i<=33; i++) {
                if(!answerKeys[y][i]) {
                    const opts = ['A','B','C','D'];
                    answerKeys[y][i] = opts[Math.floor(Math.random() * 4)];
                }
            }
        });
    }
    fillMockData();

    // ==========================================
    // 2. STATE VARIABLES
    // ==========================================
    let currentYear = "";
    let questionOrder = [];
    let currentIndex = 0;

    // 【新增】記錄學生姓名與 Google API 網址
    let userName = "";
    // ⚠️ 請把引號內的網址換成您在「第三步」複製出來的網址！
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbxUcO8E6McSvH2g2uYXkyrCrkuByWDVyhl9d52n31gk2bo8bl0C2acUePRE2ylLW8fz/exec";
	
    // User Answers stores: { qNum, selected, timeSpent }
    let userAnswers = []; 
    let currentSelection = null; 

    // Audio
    let isMusicPlaying = false;
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.3;

    // --- FIXED TIMER VARIABLES ---
    let quizStartTime = 0;   // The specific timestamp (ms) when quiz started
    let quizInterval = null; // The interval ID for updating UI
    let questionStartTime = 0; // The timestamp when current question loaded

    // ==========================================
    // 3. INITIALIZATION
    // ==========================================
    const yearSelect = document.getElementById('yearSelect');
    Object.keys(answerKeys).forEach(year => {
        let option = document.createElement("option");
        option.value = year;
        option.text = year;
        yearSelect.appendChild(option);
    });

    // ==========================================
    // 4. APP LOGIC
    // ==========================================

    function resetApp() {
        stopTimer(); // Ensure timer stops
        document.getElementById('startScreen').style.display = 'block';
        document.getElementById('quizInterface').style.display = 'none';
        document.getElementById('resultInterface').style.display = 'none';
        document.getElementById('progress').innerText = "Ready";
        document.getElementById('timerBox').innerText = "Time: 00:00";
    }

    function startQuiz() {
        // 【新增】檢查姓名是否有填寫
        const nameInput = document.getElementById('userNameInput').value.trim();
        if (nameInput === "") {
            alert("Please enter your name before starting!");
            return;
        }
        userName = nameInput; // 儲存姓名
		
		currentYear = yearSelect.value;
        const totalQs = Object.keys(answerKeys[currentYear]).length;
        questionOrder = Array.from({length: totalQs}, (_, i) => i + 1);
        
        currentIndex = 0;
        userAnswers = [];
        
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('quizInterface').style.display = 'block';
        document.getElementById('resultInterface').style.display = 'none';
        
        // Start the Main Timer logic (Timestamp based)
        startTimer();
        
        // Load first question
        loadQuestion();
    }

    function loadQuestion() {
        const qNum = questionOrder[currentIndex];
        const total = questionOrder.length;
        
        // Record timestamp for Per-Question timer
        questionStartTime = Date.now();

        document.getElementById('progress').innerText = `Question ${currentIndex + 1} / ${total}`;
        
        currentSelection = null;
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.remove('selected');
        });

        // Use Placeholder Images
        const qSrc = `images/${currentYear}/q_${qNum}.JPG`;
        document.getElementById('questionImage').src = qSrc;

        const nextBtn = document.getElementById('nextBtn');
        if (currentIndex === total - 1) {
            nextBtn.innerText = "Finish & Submit 🏁";
            nextBtn.style.backgroundColor = "#27ae60";
        } else {
            nextBtn.innerText = "Next Question ➜";
            nextBtn.style.backgroundColor = "";
        }
    }

    function selectOption(opt) {
        currentSelection = opt;
        document.querySelectorAll('.option-btn').forEach(btn => {
            btn.classList.remove('selected');
        });
        document.getElementById('btn' + opt).classList.add('selected');
    }

    function submitAnswer() {
        if (!currentSelection) {
            alert("Please select an answer before proceeding.");
            return;
        }

        // Calculate duration for this specific question
        const now = Date.now();
        const duration = ((now - questionStartTime) / 1000).toFixed(1); // 1 decimal place

        userAnswers.push({
            qNum: questionOrder[currentIndex],
            selected: currentSelection,
            timeSpent: duration
        });

		// ==========================================
        // 【新增】在背景把這題的作答紀錄送到 Google Sheets
        // ==========================================
        const currentQNum = questionOrder[currentIndex];
        const correctChoice = answerKeys[currentYear][currentQNum];
        const isCorrect = (currentSelection === correctChoice);

        const recordData = {
            userName: userName,
            year: currentYear,
            qNum: currentQNum,
            myAns: currentSelection,
            correctAns: correctChoice,
            isCorrect: isCorrect,
            timeSpent: duration
        };

        fetch(GOOGLE_SHEET_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(recordData)
        })
        .then(() => console.log(`Q${currentQNum} 上傳成功`))
        .catch(e => console.error("上傳失敗", e));
        // ==========================================

        currentIndex++;
        if (currentIndex < questionOrder.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    }

    // ==========================================
    // 5. TIMER LOGIC (FIXED)
    // ==========================================

    function startTimer() {
        // 1. Record the exact Start Time (ms)
        quizStartTime = Date.now();
        
        // 2. Clear any existing interval to prevent duplicates
        if (quizInterval) clearInterval(quizInterval);

        // 3. Start UI update loop
        quizInterval = setInterval(() => {
            const now = Date.now();
            const elapsed = Math.floor((now - quizStartTime) / 1000);
            document.getElementById('timerBox').innerText = "Time: " + formatTime(elapsed);
        }, 1000);
    }

    function stopTimer() {
        if (quizInterval) {
            clearInterval(quizInterval);
            quizInterval = null;
        }
    }

    function getFinalTotalTime() {
        // Calculate total duration directly from timestamps for accuracy
        const now = Date.now();
        const totalSeconds = Math.floor((now - quizStartTime) / 1000);
        return formatTime(totalSeconds);
    }

    function formatTime(secs) {
        const m = Math.floor(secs / 60).toString().padStart(2, '0');
        const s = (secs % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
    }

    // ==========================================
    // 6. RESULTS LOGIC
    // ==========================================

    function finishQuiz() {
        // 1. Get final time string BEFORE stopping UI
        const finalTimeString = getFinalTotalTime(); 
        stopTimer();

        // 2. Switch Views
        document.getElementById('quizInterface').style.display = 'none';
        document.getElementById('resultInterface').style.display = 'block';
        document.getElementById('progress').innerText = "Review Results";

        let correctCount = 0;
        const briefContainer = document.getElementById('briefGrid');
        const detailContainer = document.getElementById('reviewContainer');
        
        briefContainer.innerHTML = ""; 
        detailContainer.innerHTML = "";

        // 3. Generate Report
        userAnswers.forEach((record) => {
            const qNum = record.qNum;
            const userChoice = record.selected;
            const correctChoice = answerKeys[currentYear][qNum];
            const isCorrect = (userChoice === correctChoice);

            if (isCorrect) correctCount++;

            // A. Brief Review Item
            const briefItem = document.createElement('a');
            briefItem.className = `brief-item ${isCorrect ? 'correct' : 'wrong'}`;
            briefItem.innerText = qNum;
            briefItem.href = `#review-q-${qNum}`;
            briefContainer.appendChild(briefItem);

            // B. Detailed Review Card
            const card = document.createElement('div');
            card.className = `review-card ${isCorrect ? 'correct' : 'wrong'}`;
            card.id = `review-q-${qNum}`;
            
            card.innerHTML = `
                <div class="review-header">
                    <span>Question #${qNum}</span>
                    <div>
                        <span style="color:#666; font-size:0.9rem; margin-right:10px;">⏱ ${record.timeSpent}s</span>
                        <span class="status-badge ${isCorrect ? 'bg-success' : 'bg-danger'}">
                            ${isCorrect ? 'Correct' : 'Wrong'}
                        </span>
                    </div>
                </div>
                <div style="margin-bottom: 10px;">
                    <img src="images/${currentYear}/q_${qNum}.JPG" style="width:100%; border-radius:5px;">
                </div>
                <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px;">
                    <span style="color: ${isCorrect ? 'green' : 'red'}">Your Answer: ${userChoice}</span>
                    <span style="color: green">Correct Answer: ${correctChoice}</span>
                </div>
                <div class="explanation-box">
                    <p style="margin:0 0 5px 0; font-size:0.9rem; color:#666;">Explanation:</p>
                    <img src="images/${currentYear}/a_${qNum}.JPG" style="width:100%; border-radius:5px;">
                </div>
            `;
            detailContainer.appendChild(card);
        });

        // 4. Update Summary
        document.getElementById('finalScore').innerText = `${correctCount} / ${userAnswers.length}`;
        document.getElementById('finalTime').innerText = `Total Time: ${finalTimeString}`;
    }

    // ==========================================
    // 7. UTILITIES
    // ==========================================

    function toggleMusic() {
        if (isMusicPlaying) {
            bgMusic.pause();
            isMusicPlaying = false;
        } else {
            bgMusic.play().then(() => {
                isMusicPlaying = true;
            }).catch(e => alert("Please interact with the page first (click somewhere) to play audio."));
        }
    }

</script>

</body>
</html>
